    <!-- 모달 -->
    <div class="backdrop" id="modal" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-bar">
          <span class="modal-label" id="modalTitle">—</span>
          <button class="modal-x" id="modalClose" aria-label="닫기">✕</button>
        </div>
        <div class="modal-video">
          <iframe
            id="ytFrame"
            allow="autoplay; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <script>
      /* ── 모달 ── */
      const modal = document.getElementById("modal");
      const ytFrame = document.getElementById("ytFrame");
      const modalTitle = document.getElementById("modalTitle");

      function openModal(ytId, title) {
        ytFrame.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
        modalTitle.textContent = title;
        modal.classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeModal() {
        ytFrame.src = "";
        modal.classList.remove("open");
        document.body.style.overflow = "";
      }

      document
        .getElementById("modalClose")
        .addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      document.getElementById("content").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        openModal(card.dataset.yt, card.dataset.title);
      });

      /* ── 필터 ── */
      document.getElementById("filterList").addEventListener("click", (e) => {
        const li = e.target.closest("li");
        if (!li) return;

        document
          .querySelectorAll(".filter-list li")
          .forEach((el) => el.classList.remove("active"));
        li.classList.add("active");

        const filter = li.dataset.filter;

        document.querySelectorAll(".card").forEach((card) => {
          const tags = (card.dataset.tags || "").split(",");
          card.style.display =
            filter === "all" || tags.includes(filter) ? "" : "none";
        });

        /* mixed-row: 두 카드 모두 숨으면 row 전체 숨김 */
        document.querySelectorAll(".mixed-row").forEach((row) => {
          const anyVisible = [...row.querySelectorAll(".card")].some(
            (c) => c.style.display !== "none",
          );
          row.style.display = anyVisible ? "" : "none";
        });
      });
    </script>
